[LibertyBounce]
; F6 toggles cars and cutscenes; F8 toggles boats, trains and aircraft independently.
; F10 toggles all people, including the player, independently.
; Drivers and passengers always bounce with their vehicle.
; F7 reloads this file; F9 aligns squash to the current audible beat.
; F11 selects and imports your local music (no Ctrl/Shift/Alt).
; F12 turns your custom music on/off. Off: only the car radio drives the bounce
; (nothing bounces on foot). The radio is always followed when it plays:
; in a car, the station you hear drives the bounce and talk/adverts calm it.
; Page Up / Page Down: tempo +/-5 BPM.
; Home / End: amplitude +/-0.025.
; Changes made using hotkeys are saved here.
Enabled=1
OtherVehicles=1
AllPeople=0
; Loop a local track while the game is open; relative paths are beside this INI.
; Leave these alone and press F11 in game: the importer fills them in.
MusicEnabled=0
MusicFile=
; Position of a strong beat in this exact file, in milliseconds. F9 calibrates it.
MusicFirstBeatMs=0
MusicSourceFile=
MusicBeatMapFile=
MusicUseBeatMap=1
MusicAutoImport=1
MusicSyncOffsetMs=0
Radio=1
RadioSyncOffsetMs=0
BPM=120
Amplitude=0.20
; 0 linear, 1 sine, 2 quadratic, 3 bounce
Easing=1
; Hotkeys as Windows virtual-key codes (hex or decimal). F1=0x70 ... F12=0x7B,
; PageUp=0x21, PageDown=0x22, End=0x23, Home=0x24, [=0xDB, ]=0xDD, -=0xBD, ==0xBB.
KeyCars=0x75
KeyReload=0x76
KeyOtherVehicles=0x77
KeyAlignBeat=0x78
KeyAllPeople=0x79
KeyImportMusic=0x7A
KeyBpmUp=0x21
KeyBpmDown=0x22
KeyAmplitudeUp=0x24
KeyAmplitudeDown=0x23
KeyCustomMusic=0x7B
